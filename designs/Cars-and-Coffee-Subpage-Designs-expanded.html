const to=(id,label,cls='')=>'<a class="'+cls+'" href="#'+id+'">'+label+'</a>';
const button=(id,label,alt=false)=>to(id,label,'btn'+(alt?' alt':''));
const image=(key,alt)=>'<img src="'+photos[key]+'" alt="'+alt+'">';
const cards=(items)=>'<div class="grid scrollcards">'+items.map(([key,title,copy,id,meta])=>'<article class="card">'+image(key,title)+'<div class="pad">'+(meta?'<span class="eyebrow">'+meta+'</span>':'')+'<h3>'+to(id,title)+'</h3><p>'+copy+'</p></div></article>').join('')+'</div>';
const section=(title,content)=>'<section class="section"><div class="wrap">'+(title?'<h2>'+title+'</h2>':'')+content+'</div></section>';
const title=(name,copy='',key='',label='')=>'<section class="'+(key?'hero':'title')+'"'+(key?' style="--photo:url('+photos[key]+')"':'')+'><div class="wrap">'+(label?'<span class="eyebrow">'+label+'</span>':'')+'<h1>'+name+'</h1><p>'+copy+'</p></div></section>';
const chips=(items)=>'<div class="chips">'+items.map(([label,id])=>to(id,label,'chip')).join('')+'</div>';
const facts=(pairs)=>'<dl class="facts">'+pairs.map(([a,b])=>'<div><dt>'+a+'</dt><dd>'+b+'</dd></div>').join('')+'</dl>';
const panel=(body,style='')=>'<div class="panel '+style+'">'+body+'</div>';
const split=(a,b,equal=false)=>'<div class="split '+(equal?'equal':'')+'">'+a+b+'</div>';
const faqs=(pairs)=>'<div class="faq">'+pairs.map(([q,a])=>'<details><summary>'+q+'</summary><p>'+a+'</p></details>').join('')+'</div>';
const field=(name,type='text')=>'<label class="field">'+name+(type==='textarea'?'<textarea required></textarea>':Array.isArray(type)?'<select>'+type.map(x=>'<option>'+x+'</option>').join('')+'</select>':'<input type="'+type+'" '+(['file','url','tel'].includes(type)?'':'required')+'>')+'</label>';
const demo=(label)=>'<button class="btn" type="button" data-demo="'+label+'">'+label+'</button>';
const form=(fields,label)=>'<form class="form">'+fields.map(x=>field(...x)).join('')+'<label><input required type="checkbox"> I agree to be contacted about this enquiry.</label><p>'+demo(label)+'</p></form>';

const placeFaq=(name)=>faqs([
 ['Are car meets in '+name+' free?','Most of our breakfast meets are free to attend; we ask you to RSVP so we can plan parking. Tours, garage nights and race nights are ticketed, and the price is on each event.'],
 ['Do I need a special car to come along?','No. Classics, modern performance cars, track cars and daily drivers are all welcome, and so are people who come without a car to look around.'],

 +section('Regular meets and venues','<p>These happen regularly. Dates and booking details are on each event page.</p>'+cards(venues))
 +section('The '+name+' car scene',split(prose(d.scene),panel('<h3>Popular here</h3>'+chips([['Classic cars',10],['Track days',10],['Detailing and wraps',10],['Sim racing',25],['Restoration and builds',10]])+'<h3>Useful guides</h3>'+chips([['Your first car meet',14],['Before you buy a classic',14],['Photographing cars at a meet',14]]))))

 +section('Clubs and hubs near '+name,cards(clubs)+'<p>'+button(12,'Join the Cars and Coffee club')+'</p>')

function render(){
 const route=location.hash.slice(1);
 const id=route===''?0:Number(route);
 const page=Number.isInteger(id)&&id>=0&&id<=33?id:33;
 picker.value=page;
 sheet.innerHTML=page?shellHeader+'<div class="wrap crumb">'+to(0,'Design index')+' › '+viewNames[page]+'</div><main>'+pages[page-1]()+'</main>'+([19,27,30,31,32,33].includes(page)?'':join)+footer:index;
 if(page===32){showResults('');}
 window.scrollTo(0,0);
}
function showResults(query){
 const groups=[['Events',events],['News',news],['Guides',guides],['Places',towns],['Businesses',businesses]];
 const results=groups.map(([name,items])=>[name,items.filter(item=>item.slice(1,3).join(' ').toLowerCase().includes(query.toLowerCase()))]).filter(([,items])=>items.length);
 document.querySelector('#search-results').innerHTML=results.length?results.map(([name,items])=>'<h3>'+name+' ('+items.length+')</h3>'+cards(items)).join(''):'<p>No sample results found.</p>';
}
picker.addEventListener('change',()=>location.hash=picker.value);
const phone=document.querySelector('#phone'),wide=document.querySelector('#wide');
function mode(mobile){sheet.classList.toggle('phone',mobile);phone.setAttribute('aria-pressed',mobile);wide.setAttribute('aria-pressed',!mobile);}
phone.onclick=()=>mode(true);wide.onclick=()=>mode(false);
document.addEventListener('submit',event=>{
 if(event.target.id!=='search-form')return;
 event.preventDefault();
 const query=new FormData(event.target).get('q');
 if(!document.querySelector('#search-results')){location.hash='32';return;}
 showResults(query);
});
document.addEventListener('click',event=>{
 const jump=event.target.closest('[data-section-link]');
 if(jump){event.preventDefault();document.querySelector(jump.getAttribute('href'))?.scrollIntoView();return;}
 const control=event.target.closest('[data-demo],[data-photo]');
 if(!control)return;
 const content=document.querySelector('#dialog-content');
 const key=control.dataset.photo;
 if(key){content.innerHTML=image(key,control.getAttribute('aria-label'));}else{content.textContent=control.dataset.demo+' · Design preview';}
 dialog.showModal();
});
window.addEventListener('hashchange',render);
mode(matchMedia('(max-width: 550px)').matches);
render();
