<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cars and Coffee Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script>
// CoreUI stylesheet: try jsDelivr, then unpkg.
(function () {
  var srcs = [
    "https://cdn.jsdelivr.net/npm/@coreui/coreui@5.2.0/dist/css/coreui.min.css",
    "https://unpkg.com/@coreui/coreui@5.2.0/dist/css/coreui.min.css"
  ], i = 0;
  function next() {
    if (i >= srcs.length) return;
    var l = document.createElement("link"); l.rel = "stylesheet"; l.href = srcs[i++];
    l.onerror = function () { l.remove(); next(); };
    document.head.insertBefore(l, document.getElementById("admin-css"));
  }
  next();
})();
</script>
<link rel="stylesheet" href="/admin.css" id="admin-css">
</head>
<body>
<div class="sidebar sidebar-dark sidebar-fixed border-end" id="sidebar" aria-label="Main navigation" hidden>
  <div class="sidebar-header border-bottom">
    <a class="sidebar-brand" href="/" data-link><img src="/logo.svg" alt="" width="36" height="35"><span>Admin</span></a>
    <button class="btn-close btn-close-white d-lg-none" type="button" id="sidebar-close" aria-label="Close menu"></button>
  </div>
  <ul class="sidebar-nav" id="sidenav"></ul>
  <div class="sidebar-footer border-top small px-3 py-2"><a href="https://www.carsandcoffee.uk" target="_blank" rel="noopener">View website ↗</a> · <a href="https://club.carsandcoffee.uk" target="_blank" rel="noopener">Club ↗</a></div>
</div>
<div class="sidebar-backdrop" id="backdrop" hidden></div>

<div class="wrapper d-flex flex-column min-vh-100" id="wrapper">
  <header class="header header-sticky p-0 mb-4" id="topbar" hidden>
    <div class="container-fluid border-bottom px-4">
      <button class="header-toggler d-lg-none" type="button" id="sidebar-open" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <nav aria-label="breadcrumb" class="ms-2 me-auto"><ol class="breadcrumb my-0" id="crumbs"></ol></nav>
      <div class="d-flex align-items-center gap-2">
        <span class="small text-body-secondary d-none d-md-inline" id="whoami"></span>
        <button class="btn btn-sm btn-outline-secondary" type="button" id="signout">Sign out</button>
      </div>
    </div>
  </header>
  <main class="body flex-grow-1" id="main" tabindex="-1">
    <div class="container-lg px-4" id="view"><div class="py-5 text-center text-body-secondary">Loading…</div></div>
  </main>
</div>
<div class="toast-holder" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
